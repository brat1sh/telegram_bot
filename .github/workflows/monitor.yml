name: Check CEK outages

on:
  schedule:
    # Каждые 5 минут (минимум, который поддерживает GitHub Actions).
    # Фактический запуск может задерживаться на несколько минут.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Нужно, чтобы workflow мог закоммитить обновлённый last_seen_id.txt.
permissions:
  contents: write

# Два запуска подряд не должны одновременно перезаписывать состояние.
concurrency:
  group: check-cek-outages
  cancel-in-progress: false

jobs:
  monitor:
    name: Check @cek_info
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check posts for outages
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: Commit last_seen_id.txt
        # Состояние сохраняем даже при падении проверки,
        # чтобы не отправлять одни и те же посты повторно.
        if: always()
        run: |
          set -e
          if [ ! -f last_seen_id.txt ]; then
            echo "last_seen_id.txt отсутствует — коммитить нечего."
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Файл перечислен в .gitignore, поэтому добавляем его принудительно.
          git add -f last_seen_id.txt

          if git diff --cached --quiet; then
            echo "last_seen_id.txt не изменился."
            exit 0
          fi

          git commit -m "Update last_seen_id.txt"
          git push origin "HEAD:${GITHUB_REF_NAME}"
